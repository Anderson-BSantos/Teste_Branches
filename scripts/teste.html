<!doctype html>
<html lang="pt-br">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="profile.css">
    <title>Profile</title>
    </head>
<body>
    <header class="page-cover">
        <h2>Editar Perfil</h2>
        <form id="form-perfil">
          <input type="text" id="nome" placeholder="Nome completo" required />
          <input type="tel" id="telefone" placeholder="Telefone (ex.: 11987654321)" required />
          <input type="email" id="email" disabled />
          <input type="text" id="plano" disabled />
          <input type="file" id="foto" accept="image/*" />
          <button type="submit">Salvar Perfil</button>
        </form>
      
        <hr />
      
        <h3>Prévia do Perfil</h3>
        <div id="preview" class="perfil-preview">
          <img id="preview-foto" src="default-avatar.png" alt="Foto do perfil" />
          <p><strong>Nome:</strong> <span id="preview-nome">-</span></p>
          <p><strong>Telefone:</strong> <span id="preview-telefone">-</span></p>
          <p><strong>Email:</strong> <span id="preview-email">-</span></p>
          <p><strong>Plano:</strong> <span id="preview-plano">-</span></p>
        </div>
      
        <!-- Firebase SDKs -->
        <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>
        <script src="scripts/perfil.js"></script>
      </header>
      
      <style>
        #form-perfil button:disabled {
          background-color: #cccccc;
          cursor: not-allowed;
        }
        #preview-foto {
          width: 100px;
          height: 100px;
          border-radius: 50%;
          object-fit: cover;
        }
      </style>
      
      <script>
      // Pré-visualização da foto ao selecionar um arquivo
      document.getElementById("foto").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            document.getElementById("preview-foto").src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      });
      </script>
      </body>
</body>
</html>
